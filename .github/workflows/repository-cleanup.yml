
name: Repository Cleanup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  deployments: write

concurrency:
  group: repository-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Cleanup repository resources
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            // =========================================
            // CONFIGURATION
            // =========================================

            const DRY_RUN = true;

            const PAGES_ENV = "github-pages";
            const PAGES_PATH =
              "dynamic/pages/pages-build-deployment";

            const { owner, repo } = context.repo;

            let deleted = 0;
            let skipped = 0;

            async function remove(label, callback) {
              if (DRY_RUN) {
                console.log(`[DRY RUN] ${label}`);
                return;
              }

              try {
                await callback();
                deleted++;
                console.log(`[DELETED] ${label}`);
              } catch (error) {
                skipped++;
                console.log(
                  `[SKIPPED] ${label}: ${error.message}`
                );
              }
            }

            // =========================================
            // 1. WORKFLOW RUNS
            // =========================================

            console.log("=== Workflow Runs ===");

            const runs = [];

            for (let page = 1; page <= 10; page++) {
              const response =
                await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  per_page: 100,
                  page
                });

              const batch = response.data.workflow_runs ?? [];

              runs.push(...batch);

              if (batch.length < 100) break;
            }

            console.log(`Fetched ${runs.length} workflow runs`);

            console.log("Recent workflow metadata:");

            for (const run of runs.slice(0, 5)) {
              console.log({
                id: run.id,
                name: run.name,
                path: run.path,
                status: run.status,
                conclusion: run.conclusion
              });
            }

            const pagesRuns = runs
              .filter(run =>
                run &&
                run.status === "completed" &&
                (
                  run.path === PAGES_PATH ||
                  run.name === "pages build and deployment"
                )
              )
              .sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );

            const keeperRun = pagesRuns.find(
              run => run.conclusion === "success"
            );

            if (!keeperRun) {
              throw new Error(
                "No successful Pages run found. " +
                "Aborting all cleanup."
              );
            }

            console.log(
              `Keeping Pages run ${keeperRun.id}`
            );

            // =========================================
            // 2. ARTIFACTS
            // Delete old artifacts before deleting runs
            // =========================================

            console.log("=== Artifacts ===");

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner,
                repo,
                per_page: 100
              },
              response => response.data.artifacts
            );

            const runMap = new Map(
              runs.map(run => [run.id, run])
            );

            for (const artifact of artifacts) {
              const runId = artifact.workflow_run?.id;

              if (runId === keeperRun.id) {
                skipped++;
                continue;
              }

              const associatedRun = runMap.get(runId);

              // Unknown or active runs are protected
              if (
                !associatedRun ||
                associatedRun.status !== "completed"
              ) {
                skipped++;
                continue;
              }

              await remove(
                `Artifact ${artifact.id} (${artifact.name})`,
                () => github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                })
              );
            }

            // =========================================
            // 3. WORKFLOW RUNS
            // =========================================

            console.log("=== Workflow Runs Cleanup ===");

            for (const run of runs) {
              if (run.id === keeperRun.id) continue;

              if (run.status !== "completed") {
                skipped++;
                continue;
              }

              await remove(
                `Run ${run.id} (${run.name})`,
                () => github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                })
              );
            }

            // =========================================
            // 4. ACTIONS CACHES
            // =========================================

            console.log("=== Actions Caches ===");

            // Collect all cache IDs before deleting.
            // This avoids pagination shifting.

            const caches = [];

            for (let page = 1; ; page++) {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/actions/caches",
                {
                  owner,
                  repo,
                  per_page: 100,
                  page
                }
              );

              const items =
                response.data.actions_caches || [];

              caches.push(...items);

              if (items.length < 100) break;
            }

            for (const cache of caches) {
              await remove(
                `Cache ${cache.id} (${cache.key})`,
                () => github.request(
                  "DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}",
                  {
                    owner,
                    repo,
                    cache_id: cache.id
                  }
                )
              );
            }

            // =========================================
            // 5. DEPLOYMENTS
            // =========================================

            console.log("=== Pages Deployments ===");

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                per_page: 100
              }
            );

            const pages = deployments
              .filter(d => d.environment === PAGES_ENV)
              .sort((a, b) =>
                new Date(b.created_at) -
                new Date(a.created_at)
              );

            const records = [];

            for (const deployment of pages) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 100
                }
              );

              records.push({
                deployment,
                latestState: statuses[0]?.state || "unknown",
                hasSucceeded: statuses.some(
                  status => status.state === "success"
                )
              });
            }

            // Preserve the newest historically successful
            // Pages deployment.

            const keeperDeployment = records.find(
              record => record.hasSucceeded
            );

            if (!keeperDeployment) {
              console.log(
                "No verifiable successful deployment. " +
                "Skipping deployment cleanup."
              );
            } else {
              console.log(
                `Keeping deployment ` +
                keeperDeployment.deployment.id
              );

              for (const record of records) {
                const deployment = record.deployment;

                if (
                  deployment.id ===
                  keeperDeployment.deployment.id
                ) {
                  continue;
                }

                if (record.latestState !== "inactive") {
                  skipped++;
                  console.log(
                    `SKIPPED deployment ${deployment.id}: ` +
                    record.latestState
                  );
                  continue;
                }

                await remove(
                  `Deployment ${deployment.id}`,
                  () => github.rest.repos.deleteDeployment({
                    owner,
                    repo,
                    deployment_id: deployment.id
                  })
                );
              }
            }

            // =========================================
            // SUMMARY
            // =========================================

            console.log("");
            console.log("========== SUMMARY ==========");
            console.log(`Mode: ${DRY_RUN ? "DRY RUN" : "LIVE"}`);
            console.log(`Deleted: ${deleted}`);
            console.log(`Skipped: ${skipped}`);
            console.log(`Preserved Pages Run: ${keeperRun.id}`);
            console.log(
              `Preserved Deployment: ${
                keeperDeployment?.deployment.id ?? "unknown"
              }`
            );
            console.log("=============================");
